# Сборка и публикация сайта «Интеллект» на GitVerse Pages.
# Настройка репозитория: Settings → Pages → Source = «Воркфлоу» (Workflow).
# CI/CD: «Use configuration from .github/workflows».
name: GitVerse Pages Static

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        run: npm run build

      # Прикрепляем артефакт сборки (Astro собирает в dist/)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: 'dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # Go необходим для выполнения deploy-pages
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '>=1.23'

      - name: Deploy to GitVerse Pages
        id: deployment
        uses: actions/deploy-pages@v1
        with:
          artifact_name: gitverse-pages

      - name: Print deploy URL
        run: echo "🌐 page_url = ${{ steps.deployment.outputs.page_url }}"
