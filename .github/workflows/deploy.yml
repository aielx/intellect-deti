# Сборка и публикация сайта «Интеллект» на GitVerse Pages.
# Настройка репозитория: Settings → Pages → Source = «Воркфлоу» (Workflow).
# CI/CD: «Use configuration from .github/workflows».
name: Deploy to GitVerse Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Один job: сборка + деплой подряд (act_runner в GitVerse надёжнее с одним job).
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        run: npm run build

      # GitVerse upload-pages-artifact ожидает каталог _site.
      - name: Stage site to _site
        run: cp -r dist _site

      - name: Upload pages artifact
        uses: gitverse/upload-pages-artifact@v1.0.0
        with:
          path: _site

      - name: Deploy to GitVerse Pages
        uses: gitverse/deploy-pages@v1.0.0
