# Сборка и публикация сайта «Интеллект» на GitHub Pages.
# Настройка репозитория: Settings → Pages → Source = «GitHub Actions».
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        # Кастомный домен intellect-deti.ru: base = '/' (значение по умолчанию в astro.config.mjs).
        run: npm run build

      # Прикрепляем артефакт сборки (Astro собирает в dist/).
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print deploy URL
        run: echo "🌐 page_url = ${{ steps.deployment.outputs.page_url }}"
